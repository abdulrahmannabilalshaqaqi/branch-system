name: بناء نسخة Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: فك حزمة المصدر
        shell: pwsh
        run: |
          $zips = @(Get-ChildItem -Filter "*.zip")
          if ($zips.Count -eq 0) { throw "لا يوجد ملف zip في جذر المستودع" }
          if ($zips.Count -gt 1) { throw "يوجد أكثر من ملف zip في الجذر — أبقِ ملفًا واحدًا فقط" }
          Expand-Archive -Path $zips[0].FullName -DestinationPath "." -Force

      -       - name: تثبيت المتطلبات
        run: |
          python -m pip install --upgrade pip
          pip install -r sdf_pkg/requirements-dev.txt
          pip install pypdf

      - name: تشغيل الاختبارات
        run: python -m pytest sdf_pkg/tests/ -q

      - name: بناء PyInstaller
        working-directory: sdf_pkg
        run: pyinstaller build/SDFBranchSystem.spec

      - name: تثبيت Inno Setup
        run: choco install innosetup -y

      - name: بناء المثبت
        working-directory: sdf_pkg
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build/setup.iss

      - name: رفع المثبت
        uses: actions/upload-artifact@v4
        with:
          name: SDFBranchSystem-Setup
          path: sdf_pkg/dist/SDFBranchSystem-Setup-*.exe

      - name: رفع النسخة المحمولة
        uses: actions/upload-artifact@v4
        with:
          name: SDFBranchSystem-Portable
          path: sdf_pkg/dist/SDFBranchSystem/
